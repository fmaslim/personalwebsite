<h2>Todo HTTP Practice</h2>

<div *ngFor="let todo of todos">
    <p>
        <strong>ID: </strong>
        {{ todo.id }}
    </p>
    <p>
        <strong>todo: </strong>
        {{ todo.todo }}
    </p>
    <p>
        <strong>completed: </strong>
        {{ todo.completed }}
    </p>
    <p>
        <strong>User ID: </strong>
        {{ todo.userId }}
    </p>
</div>
